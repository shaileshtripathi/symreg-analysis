name: Symbolic Regression Analysis

on:
  push:
    branches: [main]
  workflow_dispatch:   # adds manual "Run workflow" button in GitHub UI

jobs:
  run-analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true          # needed if you store .feather/.csv via Git LFS

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4'

      - name: Install system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libfontconfig1-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libfreetype6-dev \
            libpng-dev \
            libtiff5-dev \
            libjpeg-dev \
            libgit2-dev \
            libarrow-dev

      - name: Install R packages
        run: |
          Rscript -e '
            pkgs <- c("arrow","dplyr","reshape2","ggplot2","colorspace","PMCMRplus")
            install.packages(pkgs, repos="https://cloud.r-project.org")
            # scmamp is not on CRAN — install from GitHub
            install.packages("remotes", repos="https://cloud.r-project.org")
            remotes::install_github("b0rxa/scmamp")
          '

      - name: Run analysis
        run: Rscript R/analysis.R

      - name: Upload result plots
        uses: actions/upload-artifact@v4
        with:
          name: plots-${{ github.run_number }}
          path: results/
          retention-days: 30
