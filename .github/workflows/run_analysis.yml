name: Symbolic Regression Analysis

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  run-analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4'

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-pkgs-${{ hashFiles('**/run_analysis.yml') }}
          restore-keys: r-pkgs-

      - name: Install system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libcurl4-openssl-dev libssl-dev libxml2-dev \
            libfontconfig1-dev libharfbuzz-dev libfribidi-dev \
            libfreetype6-dev libpng-dev libtiff5-dev libjpeg-dev \
            libgit2-dev cmake

      - name: Install R packages
        run: |
          Rscript -e 'install.packages(
            c("arrow","dplyr","reshape2","ggplot2","colorspace"),
            repos="https://cloud.r-project.org"
          )'

      - name: Run analysis
        run: Rscript R/analysis.R

      - name: Commit plots to repo
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add results/
          git diff --staged --quiet || git commit -m "Update plots"
          git push origin HEAD:main --force-with-lease

      - name: Upload plots
        uses: actions/upload-artifact@v4

      - name: Upload plots
        uses: actions/upload-artifact@v4
        with:
          name: plots-${{ github.run_number }}
          path: results/
          retention-days: 30
