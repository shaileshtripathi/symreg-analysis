name: Symbolic Regression Analysis

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  run-analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4'

      - name: Install system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libcurl4-openssl-dev libssl-dev libxml2-dev \
            libfontconfig1-dev libharfbuzz-dev libfribidi-dev \
            libfreetype6-dev libpng-dev libtiff5-dev libjpeg-dev \
            libgit2-dev cmake

      - name: Install arrow
        run: Rscript -e 'install.packages("arrow", repos="https://cloud.r-project.org")'

      - name: Install CRAN packages
        run: |
          Rscript -e 'install.packages(c("dplyr","reshape2","ggplot2","colorspace","PMCMRplus","remotes"), repos="https://cloud.r-project.org")'

      - name: Install scmamp
        run: |
          Rscript -e '
            install.packages("remotes", repos="https://cloud.r-project.org")
            remotes::install_github("b0rxa/scmamp", dependencies=TRUE, upgrade="never")
          '

      - name: Run analysis
        run: Rscript R/analysis.R

      - name: Upload plots
        uses: actions/upload-artifact@v4
        with:
          name: plots-${{ github.run_number }}
          path: results/
          retention-days: 30